<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Лид-монитор</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header>
      <h1>Мониторинг лидов</h1>
      <p class="subtitle">Выберите группы и ключевые слова для отслеживания</p>
    </header>
    <div class="actions">
      <button id="btn-groups" class="action-btn">Группы</button>
      <button id="btn-keywords" class="action-btn">Ключевые слова</button>
    </div>
    <div id="content" class="card"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
